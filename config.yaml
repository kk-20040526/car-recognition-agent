# ============================================================
# 识车助手 —— 运行配置
# ============================================================
# 修改后保存即可；API Key 请写在 .env 里（复制 .env.example 为 .env）
# 不要把真实 Key 提交到代码仓库！

# 模型路径（相对项目根目录）
model_path: models/improved/best.pt

# 车型资料库路径
knowledge_path: data/car_knowledge.json

# SQLite 数据库路径
db_path: storage/app.db

# 上传图片存放目录
upload_dir: storage/uploads

# 置信度阈值：低于此值时提示用户确认
confidence_threshold: 0.55

# unknown 拒识阈值：最大概率低于此值时判为 unknown
unknown_threshold: 0.40

# 多轮对话历史消息数
history_messages: 12

# 大模型配置（阿里云百炼 OpenAI 兼容接口）
deepseek:
  base_url: https://ws-yfu509xzyhlngkyd.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  model: qwen-flash
  temperature: 0.3
  timeout: 60
  # API Key 从环境变量 DASHSCOPE_API_KEY 读取（见 .env）
  api_key_env: DASHSCOPE_API_KEY
